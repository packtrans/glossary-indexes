name: Build glossary indexes

on:
  workflow_dispatch:
  schedule:
    # UTC 00:00 on the 1st of every month
    - cron: "0 0 1 * *"

permissions:
  contents: write

env:
  GLOSSARY_REPO: packtrans/glossary
  XDG_DATA_HOME: ${{ github.workspace }}/.data
  PACKTRANS_TEMP: ${{ github.workspace }}/.cache/packtrans-glossary

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set build date (UTC)
        id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Download latest packtrans-glossary release
        id: glossary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api "repos/${GLOSSARY_REPO}/releases/latest" --jq '.tag_name')"
          asset_name="packtrans-glossary-${tag}-x86_64-unknown-linux-gnu.tar.gz"
          asset_url="$(gh api "repos/${GLOSSARY_REPO}/releases/latest" --jq ".assets[] | select(.name == \"${asset_name}\") | .browser_download_url")"
          if [[ -z "$asset_url" || "$asset_url" == "null" ]]; then
            echo "Linux asset not found in latest release: $asset_name" >&2
            exit 1
          fi
          curl -fsSL -o glossary.tar.gz "$asset_url"
          tar -xzf glossary.tar.gz
          install_dir="$(find . -maxdepth 1 -type d -name 'packtrans-glossary-*-x86_64-unknown-linux-gnu' | head -1)"
          echo "install_dir=${install_dir}" >> "$GITHUB_OUTPUT"
          echo "${PWD}/${install_dir}" >> "$GITHUB_PATH"

      - name: Create mod lists
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          set -euo pipefail
          packtrans-glossary-builder create-mod-list --platform modrinth --output modrinth-mods.json --count 1000
          packtrans-glossary-builder create-mod-list --platform curseforge --output curseforge-mods.json --count 1000

      - name: Restore mod jar cache
        uses: actions/cache@v4
        with:
          path: .cache/packtrans-glossary
          key: mod-jars-${{ runner.os }}-v1
          restore-keys: |
            mod-jars-${{ runner.os }}-v1

      - name: Download language files
        run: |
          set -euo pipefail
          mkdir -p res "${PACKTRANS_TEMP}/mods" "${PACKTRANS_TEMP}/minecraft"

          clean_jar_cache() {
            python3 <<'PY'
          import json
          import os
          import shutil
          import textwrap
          import urllib.request
          from pathlib import Path

          exec(textwrap.dedent("""
          PLATFORMS = ("modrinth", "curseforge")
          temp = Path(os.environ["PACKTRANS_TEMP"])
          mods_dir = temp / "mods"
          minecraft_dir = temp / "minecraft"
          mod_lists = [
              ("modrinth", Path("modrinth-mods.json")),
              ("curseforge", Path("curseforge-mods.json")),
          ]

          def remove_path(path: Path) -> None:
              if path.is_dir():
                  shutil.rmtree(path)
              elif path.exists():
                  path.unlink()
              print(f"Removing stale cache: {path}")

          keep_jars: set[str] = set()
          for platform, list_path in mod_lists:
              if not list_path.is_file():
                  continue
              with list_path.open(encoding="utf-8") as handle:
                  mods = json.load(handle)
              for mod in mods:
                  slug = mod.get("slug")
                  version_id = mod.get("version_id")
                  if not slug or not version_id:
                      continue
                  keep_jars.add(f"{platform}-{slug}-{version_id}.jar")

          if mods_dir.is_dir():
              for jar in mods_dir.glob("*.jar"):
                  name = jar.name
                  if name in keep_jars:
                      continue
                  if any(name.startswith(f"{platform}-") for platform in PLATFORMS):
                      remove_path(jar)
                      remove_path(mods_dir / jar.stem)

          if minecraft_dir.is_dir():
              with urllib.request.urlopen(
                  "https://launchermeta.mojang.com/mc/game/version_manifest_v2.json"
              ) as response:
                  manifest = json.load(response)
              latest = manifest["latest"]["release"]
              keep_client = f"client-{latest}.jar"
              for jar in minecraft_dir.glob("client-*.jar"):
                  if jar.name != keep_client:
                      remove_path(jar)
          """))
          PY
          }

          clean_jar_cache

          # Mod downloads may exit 1 when a mod has no language files; that is expected.
          packtrans-glossary-builder download --platform modrinth --output res \
            --temp-path "${PACKTRANS_TEMP}" --list-file modrinth-mods.json \
            || echo "::warning::Modrinth download reported failures (missing language files are expected)"
          clean_jar_cache

          packtrans-glossary-builder download --platform curseforge --output res \
            --temp-path "${PACKTRANS_TEMP}" --list-file curseforge-mods.json \
            || echo "::warning::CurseForge download reported failures (missing language files are expected)"
          clean_jar_cache

          packtrans-glossary-builder download --platform minecraft --output res \
            --temp-path "${PACKTRANS_TEMP}"
          clean_jar_cache

      - name: Build indexes and package releases
        env:
          BUILD_DATE: ${{ steps.date.outputs.date }}
        run: |
          set -euo pipefail
          mkdir -p dist indexes
          while IFS= read -r lang; do
            packtrans-glossary-builder \
              --index-path indexes \
              index --scan-dir res --lang "$lang"
            archive="dist/packtrans-glossary-index-${lang}-${BUILD_DATE}.zip"
            (cd indexes && zip -qr "../${archive}" "$lang")
            echo "Created ${archive}"
          done < <(jq -r '.[]' languages.json)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: index-${{ steps.date.outputs.date }}
          name: Glossary indexes ${{ steps.date.outputs.date }}
          files: dist/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
