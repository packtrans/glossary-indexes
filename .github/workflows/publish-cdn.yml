name: Publish glossary CDN metadata

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  CDN_BASE_URL: https://cdn.packtrans.download/glossary
  S3_PREFIX: glossary
  KEEP_VERSIONS: 3
  S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
  S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
  S3_BUCKET: ${{ secrets.S3_BUCKET }}

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'index-')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install AWS CLI
        run: pip install --quiet awscli

      - name: Publish indexes and metadata to CDN
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
        run: bash .github/scripts/publish-cdn.sh
