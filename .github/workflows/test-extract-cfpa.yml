name: Test CFPA extractor

on:
  pull_request:
    paths:
      - ".github/scripts/extract_cfpa.py"
      - "tests/**"
      - ".github/workflows/test-extract-cfpa.yml"
  push:
    branches:
      - master
    paths:
      - ".github/scripts/extract_cfpa.py"
      - "tests/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pytest
        run: pip install pytest
      - name: Run tests
        run: python3 -m pytest tests/test_extract_cfpa.py -v
